<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="100%">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#1b263b" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7928CA" />
      <stop offset="100%" stop-color="#FF0080" />
    </linearGradient>

    <!-- Grid Pattern for Tech/Dev Feel -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>

    <!-- Chat Bubble Filter -->
    <filter id="glow-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 44px;
        fill: #ffffff;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 19px;
        fill: #94a3b8;
      }
      .tag-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #38bdf8;
      }
      .pulse-circle {
        animation: pulse 4s ease-in-out infinite alternate;
      }
      @keyframes pulse {
        0% { transform: scale(0.95); opacity: 0.35; }
        100% { transform: scale(1.08); opacity: 0.65; }
      }
      .floating-node-1 {
        animation: floatOne 6s ease-in-out infinite alternate;
      }
      .floating-node-2 {
        animation: floatTwo 7s ease-in-out infinite alternate;
      }
      .floating-node-3 {
        animation: floatThree 8s ease-in-out infinite alternate;
      }
      @keyframes floatOne {
        0% { transform: translateY(0px) translateX(0px); }
        100% { transform: translateY(-12px) translateX(8px); }
      }
      @keyframes floatTwo {
        0% { transform: translateY(0px) translateX(0px); }
        100% { transform: translateY(14px) translateX(-6px); }
      }
      @keyframes floatThree {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }
    </style>
  </defs>

  <!-- Background base -->
  <rect width="1200" height="340" fill="url(#bg-grad)" rx="16" />
  <rect width="1200" height="340" fill="url(#grid)" rx="16" />

  <!-- Background Animated / Ambient Glowing Orbs -->
  <circle class="pulse-circle" cx="980" cy="110" r="140" fill="#38bdf8" filter="url(#glow-blur)" opacity="0.18" />
  <circle class="pulse-circle" cx="150" cy="240" r="160" fill="#7928CA" filter="url(#glow-blur)" opacity="0.15" />

  <!-- Animated Background Connection Graphic Flow (behind text) -->
  <g opacity="0.25">
    <path d="M 650 260 C 800 240, 850 120, 1050 140" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="6,6" />
    <path d="M 750 300 C 880 280, 920 180, 1120 220" fill="none" stroke="#ec4899" stroke-width="2" stroke-dasharray="4,6" />
  </g>

  <!-- Interactive/Dynamic Floating Visual Elements (Right Side Decorative Illustration) -->
  <g class="floating-node-1">
    <!-- Chat Card 1: Channel Stream -->
    <rect x="840" y="55" width="280" height="64" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
    <circle cx="872" cy="87" r="16" fill="#3b82f6" opacity="0.8" />
    <text x="872" y="92" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="14" fill="#ffffff" font-weight="bold">#</text>
    <rect x="902" y="77" width="100" height="8" rx="4" fill="#f1f5f9" />
    <rect x="902" y="92" width="160" height="6" rx="3" fill="#64748b" />
    <circle cx="1090" cy="87" r="5" fill="#10b981" />
  </g>

  <g class="floating-node-2">
    <!-- Chat Card 2: Direct Message / Threads -->
    <rect x="880" y="140" width="270" height="68" rx="14" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" opacity="0.95" />
    <circle cx="912" cy="174" r="16" fill="#ec4899" opacity="0.8" />
    <text x="912" y="179" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="13" fill="#ffffff" font-weight="bold">💬</text>
    <rect x="942" y="164" width="130" height="8" rx="4" fill="#f8fafc" />
    <rect x="942" y="179" width="80" height="6" rx="3" fill="#64748b" />
    <!-- Notification badge -->
    <rect x="1095" y="164" width="32" height="18" rx="9" fill="#ef4444" />
    <text x="1111" y="177" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#fff">NEW</text>
  </g>

  <g class="floating-node-3">
    <!-- Chat Card 3: Encrypted / Decentralized Pill -->
    <rect x="800" y="230" width="290" height="54" rx="14" fill="#0f172a" stroke="#10b981" stroke-width="1.2" />
    <circle cx="830" cy="257" r="14" fill="#10b981" opacity="0.2" />
    <text x="830" y="262" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#10b981">🔒</text>
    <text x="856" y="262" font-family="Segoe UI, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">E2E Encrypted &amp; Federated (Matrix)</text>
  </g>

  <!-- FOREGROUND CONTENT: Header, Badge, Titles, Subtitle (Guaranteed Clean & Visible) -->
  <g transform="translate(60, 0)">
    <!-- Top Pill Badge -->
    <g transform="translate(0, 50)">
      <rect width="250" height="32" rx="16" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.2" />
      <circle cx="16" cy="16" r="4" fill="#38bdf8" />
      <text x="28" y="21" class="tag-text">ENTERPRISE CHAT &amp; CHATOPS</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="130" class="title-text">
      Team Chat &amp; Instant Messaging
    </text>

    <!-- Gradient Bar Accent Under Title -->
    <rect x="0" y="148" width="160" height="4" rx="2" fill="url(#primary-glow)" />

    <!-- Subtitle / Meta Description -->
    <text x="0" y="188" class="subtitle-text">
      Curated directory of enterprise SaaS collaboration suites &amp; self-hosted open-source servers.
    </text>
    <text x="0" y="218" class="subtitle-text" font-size="16" fill="#64748b">
      Compare pricing, free tiers, air-gapped security, topic threading, matrix federation &amp; E2EE.
    </text>

    <!-- Quick Feature Tags / Pills -->
    <g transform="translate(0, 255)">
      <rect x="0" y="0" width="105" height="28" rx="14" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
      <text x="52" y="18" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#cbd5e1">⚡ Slack &amp; Teams</text>

      <rect x="115" y="0" width="105" height="28" rx="14" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
      <text x="167" y="18" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#cbd5e1">🛡️ Self-Hosted</text>

      <rect x="230" y="0" width="115" height="28" rx="14" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
      <text x="287" y="18" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#cbd5e1">🔐 E2E Encryption</text>

      <rect x="355" y="0" width="110" height="28" rx="14" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
      <text x="410" y="18" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#cbd5e1">🧵 Zulip Threads</text>
    </g>
  </g>
</svg>
